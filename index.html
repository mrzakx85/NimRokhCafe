<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Blossom &amp; Moss Café — Menu</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&family=DM+Sans:wght@400;500;700&display=swap"
    />
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- Decorative branches (the two images you provided) -->
    <div class="wrap">
      <header class="hero">
        <h1>کافه نیم رخ</h1>
        <p>
          قهوه، کیک و بعدازظهرهایی آرام. روی هر آیتم ضربه بزنید تا به سفارش‌تان
          اضافه شود.
        </p>
      </header>

      <nav class="cats" id="catNav" aria-label="Menu categories"></nav>
      <main id="menu"></main>
    </div>

    <footer>
      Prices are in Azerbaijani manat (₼). Please show your order to the waiter.
    </footer>

    <!-- Button at the bottom of the screen: shows the total price -->
    <button class="cart-bar" id="cartBar" type="button">
      <span><span id="cartCount">0</span> مورد</span>
      <span>مشاهده لیست</span>
      <span class="total" id="cartTotal">0.00 ₼</span>
    </button>

    <!-- Modal with the selected items -->
    <dialog id="cartModal" aria-labelledby="modalTitle">
      <div class="modal-head">
        <h3 id="modalTitle">سفارش شما</h3>
        <button
          class="icon-btn"
          id="closeModal"
          type="button"
          aria-label="Close"
        >
          ×
        </button>
      </div>
      <ul class="modal-list" id="modalList"></ul>
      <div class="modal-foot">
        <div class="sum">
          <span>کل</span
          ><span style="direction: ltr" id="modalTotal">0.00 T</span>
        </div>
        <button class="btn-clear" id="clearBtn" type="button">پاکسازی</button>
      </div>
    </dialog>

    <script src="./main.js"></script>
  </body>
</html>
